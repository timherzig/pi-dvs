minimum_pre_commit_version: '4.0'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: lockfile
        name: Lockfile matches project dependencies
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff formatting
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
        stages: [pre-commit]
      - id: mypy
        name: Strict type checking
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: tests
        name: Tests with branch coverage
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
