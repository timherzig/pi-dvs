name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Libraries and app (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            python: '3.12'
          - os: macos-14
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python }}
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - run: uv sync --locked --all-groups
      - name: Repository hygiene
        run: uv run --locked pre-commit run --all-files --hook-stage manual
      - name: Formatting, lint, types and locked dependencies
        run: |
          make lint typecheck
          uv lock --check
      - name: Read-only USBs, remote CDJ sources and two-deck application behavior
        run: uv run --locked pytest -v --junitxml=test-results.xml
      - name: Install and open the packaged application
        run: make package
      - name: Keep coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep tested distributions
        if: matrix.os == 'ubuntu-24.04-arm' && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/requirements.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  xwax-smoke:
    name: Two-deck xwax (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libasound2-dev ffmpeg curl ca-certificates patch python3
      - name: Render audio, load both decks and recover interrupted streams
        run: make xwax-linux-smoke

  xwax-macos-smoke:
    name: Two-deck xwax (macOS development)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - run: brew install pkgconf sdl2 sdl2_ttf portaudio ffmpeg
      - run: uv sync --locked --all-groups
      - run: make xwax-macos-smoke

  link-test:
    name: Serve read-only music to CDJ clients (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Concurrent CDJ clients browse and read original audio over loopback
        run: make link-test

  quality-gate:
    name: Quality gate
    if: always()
    needs: [verify, xwax-smoke, xwax-macos-smoke, link-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require application, two-deck engine and CDJ serving checks
        env:
          RESULT: ${{ needs.verify.result }}
          ENGINE_RESULT: ${{ needs.xwax-smoke.result }}
          MAC_ENGINE_RESULT: ${{ needs.xwax-macos-smoke.result }}
          LINK_RESULT: ${{ needs.link-test.result }}
        run: test "$RESULT" = success && test "$ENGINE_RESULT" = success && test "$LINK_RESULT" = success && test "$MAC_ENGINE_RESULT" = success
