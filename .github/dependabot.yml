version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
    ignore:
      - dependency-name: pyside6-essentials
        versions: ['>=6.11']
      - dependency-name: shiboken6
        versions: ['>=6.11']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
