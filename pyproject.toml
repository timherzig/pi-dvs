[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pi-dvs"
version = "0.1.0"
description = "A minimal two-deck DVS interface, starting with a macOS demo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
    # Qt 6.10 supports macOS 13; newer Qt releases raise the minimum OS version.
    "PySide6-Essentials>=6.10,<6.11",
]

[project.scripts]
pi-dvs = "pi_dvs.app:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18"]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_dvs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
